# XcodeGen spec — regenerate the Xcode project with: xcodegen generate
# (brew install xcodegen). The generated MapMoment.xcodeproj is committed,
# so regeneration is only needed after adding/removing files outside Xcode.
name: MapMoment
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  MapMoment:
    type: application
    platform: iOS
    sources:
      - path: MapMoment
        excludes:
          - "Resources/Info.plist"
          - "Resources/MapMoment.entitlements"
    dependencies:
      - package: Firebase
        products:
          - FirebaseAuth
          - FirebaseFirestore
          - FirebaseMessaging
          - FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliottrosenberg.mapmoment
        PRODUCT_NAME: MapMoment
        INFOPLIST_FILE: MapMoment/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MapMoment/Resources/MapMoment.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: YES
